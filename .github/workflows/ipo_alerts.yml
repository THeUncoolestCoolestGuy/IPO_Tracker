name: Indian IPO Tracker & GMP Alerts

on:
  schedule:
    # 02:25 UTC is 07:55 AM IST (Avoids :00 and :30 peak congestion on GitHub servers)
    - cron: '25 2 * * *'
    # 06:55 UTC is 12:25 PM IST (Avoids :00 and :30 peak congestion on GitHub servers)
    - cron: '55 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO Alert Check
        env:
          PHONE_NUMBERS: ${{ secrets.PHONE_NUMBERS }}
          WHATSAPP_PHONE_NUMBERS: ${{ secrets.WHATSAPP_PHONE_NUMBERS }}
          GMP_THRESHOLD_PERCENT: ${{ secrets.GMP_THRESHOLD_PERCENT || '10.0' }}
          NOTIFICATION_CHANNELS: ${{ secrets.NOTIFICATION_CHANNELS || 'console,telegram' }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          SILENT_ON_EMPTY: 'true'
          ZERODHA_REFERRAL_URL: ${{ secrets.ZERODHA_REFERRAL_URL || 'https://zerodha.com/open-account?c=LJ0070' }}
          UPSTOX_REFERRAL_URL: ${{ secrets.UPSTOX_REFERRAL_URL || 'https://upstox.onelink.me/0H1s/86BGGM' }}
          GROWW_REFERRAL_URL: ${{ secrets.GROWW_REFERRAL_URL || 'https://app.groww.in/v3cO/r30uflbm' }}
          GROWW_REFERRAL_CODE: ${{ secrets.GROWW_REFERRAL_CODE || '4ABMY9' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          HOUR=$(date -u +%H)
          echo "Current UTC Hour: $HOUR"
          echo "Triggered by Schedule: $EVENT_SCHEDULE"

          # Anti-stale guard: If GitHub queues and delays the run past 11:00 UTC (4:30 PM IST),
          # do NOT send outdated alerts after market application cut-off (5:00 PM IST).
          if [ "$HOUR" -ge 11 ]; then
            echo "Skipping execution: Run was delayed past 4:30 PM IST cut-off. Alert suppressed."
            exit 0
          fi

          if [ "$EVENT_SCHEDULE" = "25 2 * * *" ] || [ "$HOUR" -lt 5 ]; then
            echo "Executing Morning 8:00 AM IST Check..."
            python main.py --run-now
          else
            echo "Executing Reminder 12:30 PM IST Check..."
            python main.py --run-reminder
          fi
