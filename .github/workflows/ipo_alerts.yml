name: Indian IPO Tracker & GMP Alerts

on:
  # 1. Instant External Webhooks (cron-job.org / curl / API) - 0 queue delay
  repository_dispatch:
    types: [morning_check, reminder_check, allotment_check, nightly_allotment_check]

  # 2. Manual trigger from GitHub UI anytime
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of check to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - reminder
          - allotment

  # 3. Built-in GitHub Cron (as secondary fallback)
  schedule:
    # 02:25 UTC is 07:55 AM IST
    - cron: '25 2 * * *'
    # 06:55 UTC is 12:25 PM IST
    - cron: '55 6 * * *'
    # 16:25 UTC is 09:55 PM IST (Window for 10:00 PM IST Nightly Check)
    - cron: '25 16 * * *'

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO Alert Check
        env:
          PHONE_NUMBERS: ${{ secrets.PHONE_NUMBERS }}
          WHATSAPP_PHONE_NUMBERS: ${{ secrets.WHATSAPP_PHONE_NUMBERS }}
          GMP_THRESHOLD_PERCENT: ${{ secrets.GMP_THRESHOLD_PERCENT || '15.0' }}
          NOTIFICATION_CHANNELS: ${{ secrets.NOTIFICATION_CHANNELS || 'console,telegram' }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          SILENT_ON_EMPTY: 'true'
          ZERODHA_REFERRAL_URL: ${{ secrets.ZERODHA_REFERRAL_URL || 'https://zerodha.com/open-account?c=LJ0070' }}
          UPSTOX_REFERRAL_URL: ${{ secrets.UPSTOX_REFERRAL_URL || 'https://upstox.onelink.me/0H1s/86BGGM' }}
          GROWW_REFERRAL_URL: ${{ secrets.GROWW_REFERRAL_URL || 'https://app.groww.in/v3cO/r30uflbm' }}
          GROWW_REFERRAL_CODE: ${{ secrets.GROWW_REFERRAL_CODE || '4ABMY9' }}
        run: |
          EVENT_NAME="${{ github.event_name }}"
          EVENT_ACTION="${{ github.event.action }}"
          CHECK_TYPE="${{ github.event.inputs.check_type }}"

          echo "Trigger Event: $EVENT_NAME"
          echo "Event Action: $EVENT_ACTION"
          echo "Input Check Type: $CHECK_TYPE"

          # PATH 1: Triggered via external Webhook (cron-job.org)
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$EVENT_ACTION" = "reminder_check" ]; then
              echo "🚀 Executing 12:30 PM Reminder Check (via Webhook)..."
              python main.py --run-reminder
            elif [ "$EVENT_ACTION" = "allotment_check" ] || [ "$EVENT_ACTION" = "nightly_allotment_check" ]; then
              echo "🚀 Executing 10:00 PM Nightly Allotment Check (via Webhook)..."
              python main.py --check-allotment
            else
              echo "🚀 Executing 8:00 AM Morning Check (via Webhook)..."
              python main.py --run-now
            fi

          # PATH 2: Triggered manually from GitHub Web UI
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CHECK_TYPE" = "reminder" ]; then
              echo "▶ Executing Reminder Check (Manual Trigger)..."
              python main.py --run-reminder
            elif [ "$CHECK_TYPE" = "allotment" ]; then
              echo "▶ Executing Allotment Check (Manual Trigger)..."
              python main.py --check-allotment
            else
              echo "▶ Executing Morning Check (Manual Trigger)..."
              python main.py --run-now
            fi

          # PATH 3: Triggered by GitHub Cron (Strict 30-minute validity window)
          elif [ "$EVENT_NAME" = "schedule" ]; then
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            TOTAL_MIN=$((10#$HOUR * 60 + 10#$MIN))
            echo "Current UTC Time: $HOUR:$MIN ($TOTAL_MIN min past 00:00 UTC)"

            # Morning window: 02:20 UTC to 03:15 UTC (7:50 AM to 8:45 AM IST)
            if [ "$TOTAL_MIN" -ge 140 ] && [ "$TOTAL_MIN" -le 195 ]; then
              echo "⏰ Executing Scheduled Morning 8:00 AM IST Check..."
              python main.py --run-now --skip-if-already-dispatched
            # Reminder window: 06:50 UTC to 07:45 UTC (12:20 PM to 1:15 PM IST)
            elif [ "$TOTAL_MIN" -ge 410 ] && [ "$TOTAL_MIN" -le 465 ]; then
              echo "⏰ Executing Scheduled Reminder 12:30 PM IST Check..."
              python main.py --run-reminder --skip-if-already-dispatched
            # Nightly window: 16:20 UTC to 17:15 UTC (9:50 PM to 10:45 PM IST)
            elif [ "$TOTAL_MIN" -ge 980 ] && [ "$TOTAL_MIN" -le 1035 ]; then
              echo "⏰ Executing Scheduled Nightly 10:00 PM IST Allotment Check..."
              python main.py --check-allotment
            else
              echo "⚠️ SKIPPING: GitHub Actions runner queue delay exceeded 30 minutes."
              echo "Stale alert suppressed to prevent delayed notifications."
              exit 0
            fi

          else
            echo "Unknown trigger. Running default morning check..."
            python main.py --run-now
          fi

      - name: Persist dynamic state (Subscribers & Allotments)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json data/notified_allotments.json data/last_dispatch.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-persist dynamic state [skip ci]"
            git push origin main || echo "State push skipped (no new changes or concurrent push)"
          fi
